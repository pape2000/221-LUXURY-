name: 221 LUXURY - sync integrations

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gestionnaire-221-luxury.html'
      - 'supabase-config.js'
      - '221-luxury-supabase-runtime.js'
      - '.github/workflows/221luxury-supabase-runtime.yml'

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync 221 LUXURY direct integrations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Integrate public runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./221-luxury-supabase-runtime.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html: </body> not found')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Integrate manager Supabase config directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gestionnaire-221-luxury.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./supabase-config.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('manager: </head> not found')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit direct integrations
        shell: bash
        run: |
          if git diff --quiet -- index.html gestionnaire-221-luxury.html; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name '221 LUXURY Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html gestionnaire-221-luxury.html
          git commit -m 'chore: sync 221 LUXURY direct integrations'
          git push
