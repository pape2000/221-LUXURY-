name: 221 LUXURY - public catalog e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - 221-luxury-public-shell.html
      - 221-luxury-supabase-runtime.js
      - supabase-config.js
      - vercel.json
      - .github/workflows/221luxury-public-catalog-e2e.yml

jobs:
  public-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify live public catalog
        env:
          PUBLIC_URL: https://221-luxury-beige.vercel.app/
          SUPABASE_URL: https://shvgcroqovnhltpzceid.supabase.co
          SUPABASE_KEY: sb_publishable_t3OcJB8q9BXNcMX2Wt0ngw_xvoms06r
          STORE_ID: d818f4a0-6d7c-4873-9032-6c2d68aa3386
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          async function api(path) {
            const r = await fetch(process.env.SUPABASE_URL + path, {
              headers: {
                apikey: process.env.SUPABASE_KEY,
                Authorization: 'Bearer ' + process.env.SUPABASE_KEY
              },
              cache: 'no-store'
            });
            if(!r.ok) throw new Error('Supabase HTTP '+r.status+': '+await r.text());
            return r.json();
          }

          (async()=>{
            const rows = await api('/rest/v1/products?select=slug,name,price,stock,updated_at&store_id=eq.'+process.env.STORE_ID+'&published=eq.true&order=created_at.desc');
            if(!rows.length) throw new Error('Supabase returned zero published products.');

            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+(e.stack||e.message||String(e))));
            page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text());});
            page.on('response',r=>{if(r.status()>=500) errors.push('HTTP '+r.status()+' '+r.url());});

            await page.goto(process.env.PUBLIC_URL+'?e2e=live', {waitUntil:'domcontentloaded',timeout:120000});

            await page.waitForFunction(() =>
              document.documentElement.dataset.supabaseCatalog === 'ready',
              {timeout:120000}
            );

            const home = await page.evaluate(() => ({
              title: document.title,
              ready: document.documentElement.dataset.supabaseCatalog === 'ready',
              productLength: typeof PRODUCTS !== 'undefined' && Array.isArray(PRODUCTS) ? PRODUCTS.length : null,
              bodyText: document.body.innerText.slice(0,300),
              hasHeader: !!document.querySelector('header'),
              hasHero: !!document.querySelector('.hero')
            }));

            await page.evaluate(() => { location.hash = '#/shop?e2e=live'; });
            await page.waitForFunction(expected => {
              return document.querySelectorAll('#shopGrid .product-card').length === expected;
            }, rows.length, {timeout:120000});

            const result = await page.evaluate(latest => {
              const cards=[...document.querySelectorAll('#shopGrid .product-card')];
              return {
                cardCount:cards.length,
                expected:latest.count,
                latestNameFound:cards.some(c => c.textContent.includes(latest.name)),
                ready:document.documentElement.dataset.supabaseCatalog==='ready',
                liveImages:[...document.querySelectorAll('#shopGrid .product-media img')].slice(0,4).every(img => img.src.includes('/storage/v1/object/public/product-images/'))
              };
            }, {count:rows.length,name:rows[0].name});

            console.log(JSON.stringify({ok:true,home,result,errors:errors.slice(0,20)}));

            if(!result.ready) throw new Error('Supabase-ready flag missing.');
            if(result.cardCount!==rows.length) throw new Error('Public card count does not match Supabase.');
            if(!result.latestNameFound) throw new Error('Latest Supabase product is not visible publicly.');
            if(errors.length) throw new Error('Browser errors: '+errors.slice(0,10).join(' | '));

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE