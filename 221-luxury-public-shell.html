<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font:600 14px/1.4 system-ui,sans-serif;color:#222;z-index:10}
  </style>
</head>
<body>
<div id="loader">Chargement de 221 LUXURY…</div>
<script>
(async function(){
  'use strict';
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);
    const r=await fetch('/static-index.html?v=public-shell-2',{cache:'no-store',signal:controller.signal});
    clearTimeout(timeout);
    if(!r.ok) throw new Error('Static storefront HTTP '+r.status);
    let html=await r.text();

    /* Exterminate the automatic route scroll without touching explicit checkout scrolling elsewhere. */
    html=html.replace(/\s*window\.scrollTo\(\{\s*top:\s*0,\s*behavior:\s*'instant'\s*in\s*window\s*\?\s*'instant'\s*:\s*'auto'\s*\}\);\s*/,'\n');

    /* Supabase stays the source of truth and refreshes the catalog in the background. */
    const runtime='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>\n<script src="/221-luxury-supabase-runtime.js?v=public-progressive-2"><\/script>';
    html=html.replace('</body>',runtime+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('[221 LUXURY] public storefront load failed',e);
    const el=document.getElementById('loader');
    if(el) el.textContent=e&&e.name==='AbortError'
      ? 'Le chargement de 221 LUXURY prend trop de temps. Veuillez actualiser.'
      : 'Impossible de charger 221 LUXURY.';
  }
})();
</script>
</body>
</html>
