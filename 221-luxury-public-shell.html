<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #site-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    #catalog-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#222;font:600 14px/1.4 system-ui,sans-serif;z-index:10}
    #catalog-error{max-width:520px;padding:32px;text-align:center}
  </style>
</head>
<body>
<div id="catalog-loading">Chargement de 221 LUXURY…</div>
<iframe id="site-frame" title="221 LUXURY" src="/static-index.html?public=1&v=9"></iframe>

<script src="/supabase-config.js?v=public-8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  var frame=document.getElementById('site-frame');
  var loading=document.getElementById('catalog-loading');
  var started=false;

  function hideLoading(){
    if(loading) loading.remove();
  }

  function showError(error){
    console.error('[221 LUXURY public]',error);
    if(loading){
      loading.innerHTML='<div id="catalog-error"><strong>Impossible de charger 221 LUXURY.</strong><br><br>Le site public n’a pas pu terminer son chargement.</div>';
    }
  }

  function injectRuntime(){
    if(started) return;
    started=true;
    try{
      var doc=frame.contentDocument;
      if(!doc || !doc.body) throw new Error('Document public indisponible.');

      var script=doc.createElement('script');
      script.src='/221-luxury-supabase-runtime.js?v=live-6';
      script.async=false;
      script.onload=function(){
        setTimeout(hideLoading,150);
      };
      script.onerror=function(){
        showError(new Error('Impossible de charger le module catalogue Supabase.'));
      };
      doc.body.appendChild(script);
    }catch(error){
      showError(error);
    }
  }

  frame.addEventListener('load',injectRuntime,{once:true});
  frame.addEventListener('error',function(){showError(new Error('Chargement du site public impossible.'));},{once:true});

  // Safety fallback if the iframe is already complete when this shell executes.
  if(frame.contentDocument && frame.contentDocument.readyState==='complete'){
    injectRuntime();
  }
})();
</script>
</body>
</html>
