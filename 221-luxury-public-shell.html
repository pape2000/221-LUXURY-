<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font:600 14px/1.4 system-ui,sans-serif;color:#222;z-index:10}
  </style>
</head>
<body>
<div id="loader">Chargement de 221 LUXURY…</div>
<script>
(async function(){
  'use strict';

  const SOURCE='https://shvgcroqovnhltpzceid.supabase.co/functions/v1/public-221-luxury?v=live-8';
  try{
    const controller=new AbortController();
    const timeout=setTimeout(function(){controller.abort();},15000);
    const response=await fetch(SOURCE,{cache:'no-store',signal:controller.signal});
    clearTimeout(timeout);
    if(!response.ok) throw new Error('Public storefront HTTP '+response.status);
    const html=await response.text();
    const cleaned=html.replace(
      /window\\.scrollTo\\(\\{\\s*top:\\s*0,\\s*behavior:\\s*'instant' in window \\? 'instant' : 'auto'\\s*\\}\\);\\s*/g,
      ''
    );
    document.open();
    document.write(cleaned);
    document.close();
  }catch(error){
    console.error('[221 LUXURY] public storefront failed',error);
    const el=document.getElementById('loader');
    if(el) el.textContent='Impossible de charger 221 LUXURY.';
  }
})();
</script>
</body>
</html>
