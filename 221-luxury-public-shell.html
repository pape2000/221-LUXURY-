<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #site-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="site-frame" title="221 LUXURY" src="/index.html?static-site=1&v=6"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('site-frame');
    frame.addEventListener('load',function(){
      try{
        var doc=frame.contentDocument;
        if(!doc) throw new Error('Public site document unavailable');
        if(doc.documentElement && doc.documentElement.dataset.supabaseCatalog==='ready') return;
        var script=doc.createElement('script');
        script.src='/221-luxury-supabase-runtime.js?v=live-5';
        script.async=false;
        doc.body.appendChild(script);
      }catch(error){
        console.error('[221 LUXURY public] live catalog runtime could not start',error);
      }
    },{once:true});
  })();
  </script>
</body>
</html>
