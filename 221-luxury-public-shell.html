<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
</head>
<body style="margin:0;background:#fff">
<div id="loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font:600 14px system-ui;color:#222">Chargement de 221 LUXURY…</div>
<script>
(async function(){
  'use strict';
  try{
    // Load the public HTML shell directly from the same Vercel deployment.
    // The live Supabase runtime inside that HTML remains the source of truth
    // and refreshes the catalog after the page has painted.
    const r=await fetch('/static-index.html?v=public-shell-1',{cache:'no-store'});
    if(!r.ok) throw new Error('Static public source HTTP '+r.status);
    const html=await r.text();
    const runtimeTag='<script src="/supabase-config.js?v=public-shell-1"><\/script>\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>\n<script src="/221-luxury-supabase-runtime.js?v=public-shell-1"><\/script>';
    const bodyIndex=html.lastIndexOf('</body>');
    const out=bodyIndex>=0 ? html.slice(0,bodyIndex)+runtimeTag+'\n'+html.slice(bodyIndex) : html+runtimeTag;
    document.open();
    document.write(out);
    document.close();
  }catch(error){
    console.error('[221 LUXURY] public shell failed',error);
    const el=document.getElementById('loader');
    if(el) el.textContent='Impossible de charger 221 LUXURY.';
  }
})();
</script>
</body>
</html>
