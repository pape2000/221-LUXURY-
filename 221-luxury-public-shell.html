<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>221 LUXURY</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #site-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    #public-error{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#fff;font:600 14px/1.5 system-ui,sans-serif;color:#222;padding:24px;text-align:center;z-index:20}
  </style>
</head>
<body>
<iframe id="site-frame" title="221 LUXURY" src="/static-index.html?public-site=1&v=10"></iframe>
<div id="public-error"></div>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('site-frame');
  var error=document.getElementById('public-error');

  function fail(message){
    console.error('[221 LUXURY public]',message);
    if(error){
      error.textContent=message||'Impossible de charger 221 LUXURY.';
      error.style.display='flex';
    }
  }

  frame.addEventListener('error',function(){
    fail('Impossible de charger le site public.');
  },{once:true});

  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      if(!doc || !doc.body) throw new Error('Document public indisponible.');
      var script=doc.createElement('script');
      script.src='/221-luxury-supabase-runtime.js?v=live-8';
      script.async=false;
      script.onload=function(){ console.log('[221 LUXURY public] live catalog runtime started'); };
      script.onerror=function(){ fail('Le catalogue Supabase n’a pas pu être synchronisé.'); };
      doc.body.appendChild(script);
    }catch(e){
      fail(e.message||String(e));
    }
  },{once:true});
})();
</script>
</body>
</html>
